name: Futon Hugo APK
on:
  push:
    branches: [devel]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: futon-hugo
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Conserver la signature de test
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: futon-hugo-debug-signing-v1
      - name: Compiler et vérifier
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon -PversionCode=90901 -PversionName=9.9-hugo.1 || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Futon-Hugo
          path: app/build/outputs/apk/debug/*.apk
      - name: Publier APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Futon-Hugo.apk
          gh release view hugo-test >/dev/null 2>&1 || gh release create hugo-test --title 'Futon Hugo — test' --prerelease --notes 'Version personnalisée : notes /10 par 0,5 et mémos par chapitre. Fiche du manhwa → menu → Ma note et mes mémos. Sauvegarder les Paramètres pour inclure ces données. Signature de développement : exporter avant toute réinstallation.'
          gh release upload hugo-test Futon-Hugo.apk --clobber
